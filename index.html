<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>PilihLah</title>
<meta name="description" content="Confuse nak pilih apa? Masukkan pilihan korang, biar PilihLah pilihkan!" />
<meta name="theme-color" content="#0D0D12" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="PilihLah" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<!-- Favicons -->
<link rel="icon" href="favicon.ico" sizes="48x48" />
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/favicon-32x32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="icons/favicon-16x16.png" type="image/png" sizes="16x16" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
<link rel="manifest" href="site.webmanifest" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="app">

  <!-- SCREEN 1: INPUT -->
  <section id="screen-input" class="screen">
    <div class="wrap">
      <h1 class="logo"><span class="logo-a">PILIH</span><span class="logo-b">LAH!</span></h1>
      <p class="tagline">Bila korang confuse nak pilih apa, biar kitorang pilihkan!</p>

      <div id="options-list" class="options-list"><!-- option rows injected by app.js --></div>

      <button id="btn-add" class="chip-locked" type="button" disabled>
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 10V8a6 6 0 1 1 12 0v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="4" y="10" width="16" height="10" rx="3" stroke="currentColor" stroke-width="2"/>
        </svg>
        Tambah pilihan (Premium — coming soon)
      </button>

      <p id="error-msg" class="error-msg" hidden>Isi dulu dua-dua pilihan tu!</p>

      <button id="btn-pilih" class="btn-primary" type="button">PILIH!</button>
      <button id="btn-install" class="btn-text" type="button" hidden>📲 Pasang app ni kat phone</button>
    </div>
  </section>

  <!-- SCREEN 2: DECIDING -->
  <section id="screen-deciding" class="screen">
    <div class="wrap centered">
      <p class="subtitle">Tengah fikir…</p>
      <div class="result-card gradient-purple-pink">
        <p id="shuffle-text" class="shuffle-text">…</p>
      </div>
    </div>
  </section>

  <!-- SCREEN 3: RESULT -->
  <section id="screen-result" class="screen">
    <div class="wrap centered">
      <p class="emoji">🎉</p>
      <p class="subtitle">Jawapannya…</p>
      <div class="result-card gradient-purple-teal">
        <p id="winner-text" class="winner-text"></p>
      </div>
      <button id="btn-again" class="btn-primary" type="button">Pilih Lagi</button>
      <button id="btn-reset" class="btn-text" type="button">Reset &amp; pilihan baru</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
